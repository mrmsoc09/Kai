version: '3.8'

# K1 Production Environment
# Usage:
#   docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Required .env.prod variables:
#   POSTGRES_PASSWORD, JWT_SECRET_KEY, K1_DEV_TOKEN,
#   ANTHROPIC_API_KEY, REDIS_URL (optional override)

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    user: "70:70"          # postgres uid inside alpine image
    container_name: k1_postgres_prod
    environment:
      POSTGRES_USER: k1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: k1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - k1_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging: *default-logging

  redis:
    image: redis:7-alpine
    user: "999:999"        # redis uid inside alpine image
    container_name: k1_redis_prod
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-}
      --save 60 1000
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - k1_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    user: "1000:1000"
    container_name: k1_backend_prod
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://k1:${POSTGRES_PASSWORD}@postgres:5432/k1
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      K1_DEV_TOKEN: ${K1_DEV_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CORS_ALLOW_CREDENTIALS: "true"
      COOKIE_SECURE: "true"
      K1_REQUIRED_SERVICES: postgres,redis
      LOG_LEVEL: INFO
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - k1_internal
      - k1_public
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *default-logging
    read_only: false
    tmpfs:
      - /tmp

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    user: "1000:1000"
    container_name: k1_worker_prod
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      DATABASE_URL: postgresql://k1:${POSTGRES_PASSWORD}@postgres:5432/k1
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - artifacts:/app/artifacts
    networks:
      - k1_internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    logging: *default-logging

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    user: "101:101"        # nginx uid inside alpine image
    container_name: k1_frontend_prod
    expose:
      - "8081"
    depends_on:
      - backend
    networks:
      - k1_public
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  artifacts:

networks:
  k1_internal:
    driver: bridge
    internal: true
  k1_public:
    driver: bridge
