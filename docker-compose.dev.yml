version: '3.8'

# K1 Local Development Environment
# Start with: ./k1 start

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: k1_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-k1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k1_pass_secure}
      POSTGRES_DB: ${POSTGRES_DB:-k1}
      # Alpine postgres image writes data into a pgdata/ subdirectory when the
      # volume root is owned by root. Point PGDATA at the actual cluster location.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k1_network
    restart: unless-stopped

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: k1_redis
    command: redis-server --appendonly yes --requirepass K1_SecR3tP4ssw0rd!_2026
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k1_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: k1_backend
    env_file: .env
    environment:
      DEBUG_MODE: "true"
      ENVIRONMENT: development
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      # Vault and Ollama run as native systemd services on the host
      VAULT_URL: http://host.docker.internal:8200
      OLLAMA_HOST: http://host.docker.internal:11434
      REDIS_URL: "redis://:K1_SecR3tP4ssw0rd!_2026@redis:6379/0"
      # Tool binaries mounted from host /opt/k1-tools/bin
      PATH: "/opt/k1-tools/bin:/opt/k1-tools/go/bin:/usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./artifacts:/app/artifacts:rw
      - ./apps:/app/apps:ro
      - ./config:/app/config:ro
      - ./tools:/app/tools:ro
      - /opt/k1-tools:/opt/k1-tools:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        python3 -m uvicorn apps.backend.src.main:app --host 0.0.0.0 --port 8080
      "
    networks:
      - k1_network
    restart: unless-stopped

  # Celery Worker for Tool Execution (OSINT / Vulnerability Scanning)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: k1_worker
    env_file: .env
    environment:
      PYTHONPATH: /app
      VAULT_URL: http://host.docker.internal:8200
      OLLAMA_HOST: http://host.docker.internal:11434
      REDIS_URL: "redis://:K1_SecR3tP4ssw0rd!_2026@redis:6379/0"
      # Align PATH for Go-installed binaries inside the worker
      PATH: "/opt/k1-tools/bin:/opt/k1-tools/go/bin:/root/go/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/go/bin"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts:rw
      - ./apps:/app/apps:ro
      - ./config:/app/config:ro
      - ./tools:/app/tools:ro
      - /opt/k1-tools:/opt/k1-tools:ro
      # Docker socket: allows worker to launch Docker containers (e.g., pentagi via _run_via_docker)
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - k1_network
    restart: unless-stopped
    command: >
      sh -c "
        celery -A apps.backend.src.worker.celery_app.celery_app worker -Q tools,intrusive --loglevel=info
      "

  # Celery Beat Scheduler — drives the rotating scan pool and other periodic tasks
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: k1_beat
    env_file: .env
    environment:
      PYTHONPATH: /app
      VAULT_URL: http://host.docker.internal:8200
      OLLAMA_HOST: http://host.docker.internal:11434
      REDIS_URL: "redis://:K1_SecR3tP4ssw0rd!_2026@redis:6379/0"
      # DATABASE_URL comes from env_file (.env) — no hardcoded password here
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts:rw
      - ./apps:/app/apps:ro
      - ./config:/app/config:ro
    networks:
      - k1_network
    restart: unless-stopped
    command: >
      celery -A apps.backend.src.worker.celery_app.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /tmp/celerybeat-schedule

  # React Frontend (Kaison Composer UI)
  frontend:
    image: node:22-alpine
    container_name: k1_frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
      NEXT_PUBLIC_K1_DEV_BOOTSTRAP_TOKEN: k1-dev-bootstrap-token-local
    ports:
      - "8081:8081"
    volumes:
      - ./apps/frontend-operator:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install &&
        npm run dev -- --hostname 0.0.0.0 --port 8081
      "
    depends_on:
      - backend
    networks:
      - k1_network
    restart: unless-stopped

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: k1_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - k1_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  k1_network:
    driver: bridge
