version: '3.8'

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.sovereign
    container_name: k1-orchestrator
    volumes:
      - .:/app
      - .k1:/app/.k1
      - logs:/app/logs
    environment:
      - K1_OPERATOR_ABSENT=true
      - K1_CHECKPOINT_ROOT_ID=checkpoints
      - TRILIUM_URL=${TRILIUM_URL}
      - TRILIUM_TOKEN=${TRILIUM_TOKEN}
    networks:
      - k1-net
    dns:
      - 1.1.1.1
      - 8.8.8.8
    cap_add:
      - NET_ADMIN # Required for advanced networking/proxychains
    restart: always

  # --- Data Layer ---
  postgres:
    image: postgres:15-alpine
    container_name: k1-db
    environment:
      - POSTGRES_USER=k1
      - POSTGRES_PASSWORD=k1_pass_secure
      - POSTGRES_DB=k1
    networks:
      - k1-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: k1-cache
    networks:
      - k1-net

networks:
  k1-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: k1br0
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  logs:
