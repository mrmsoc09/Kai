name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        env:
          PYTHONPATH: .
        run: |
          python -m ruff check apps/backend modules tests
      - name: Format
        env:
          PYTHONPATH: .
        run: |
          python -m black --check apps/backend modules tests
          python -m isort --check-only apps/backend modules tests
      - name: Type check
        env:
          PYTHONPATH: .
        run: python -m mypy apps/backend/src modules tests
      - name: Tests
        env:
          PYTHONPATH: .
          K1_DEV_TOKEN: test-token
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: apps/frontend
        run: npm install
      - name: Build
        working-directory: apps/frontend
        run: npm run build
