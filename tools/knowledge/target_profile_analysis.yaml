          notes: "Despite high maturity, perimeter devices patched slower than endpoints"

        vpn_vulnerabilities:
          frequency: 0.82
          confidence: "CRITICAL"
          source: "Fortinet/Ivanti CVEs; CISA AA24-060A federal VPN exploit alert"

        supply_chain_vulnerabilities:
          frequency: 0.45
          confidence: "HIGH"
