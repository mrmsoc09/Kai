      - Node.js
      - Python
      - React/Vue
      typical_exclusions:
      - Admin panels
      - Internal APIs
      - Staging environments
    vulnerability_detection_frequencies:
      xss: 0.78
      weak_auth: 0.64
      misconfiguration: 0.71
      ssrf: 0.38
