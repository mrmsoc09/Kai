    category: content_discovery
    execution_mode: native
    binary_path: ffuf
    install_verification_cmd: ["ffuf", "-V"]
    input_schema: {"target": "url"}
    output_schema: {"discovered_paths": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1

  # Vulnerability Scanning - Primary
  - name: nuclei
