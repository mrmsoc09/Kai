version: "2.0"
# Expanded ~130-Tool Registry for KaisonOne
# Tiered architecture: Tier 1 (core), Tier 2 (targeted), Tier 3 (specialized)
# Date: 2026-05-06
# Organized: Tier 1 (core recon), Tier 2 (conditional), Tier 3 (specialized validation)

tools:
  # === TIER 1: CORE RECONNAISSANCE ===
  # These tools run on EVERY scan

  # OSINT & Attack Surface
  - name: amass
    agent_class: AmassAgent
    category: osint_asset_discovery
    execution_mode: native
    binary_path: amass
    install_verification_cmd: ["amass", "-version"]
    input_schema: {"target": "domain"}
    output_schema: {"subdomains": "list[str]"}
    timeout_seconds: 900
    safety_classification: passive
    tier: 1

  - name: subfinder
    agent_class: SubfinderAgent
    category: osint_asset_discovery
    execution_mode: native
    binary_path: subfinder
    install_verification_cmd: ["subfinder", "-version"]
    input_schema: {"target": "domain"}
    output_schema: {"subdomains": "list[str]"}
    timeout_seconds: 600
    safety_classification: passive
    tier: 1
    api_keys_required: ["CHAOS_API_KEY", "GITHUB_TOKEN", "SHODAN_API_KEY"]

  - name: spiderfoot
    agent_class: SpiderFootAgent
    category: osint_intelligence
    execution_mode: native
    binary_path: spiderfoot
    install_verification_cmd: ["spiderfoot", "-h"]
    input_schema: {"target": "domain"}
    output_schema: {"intelligence": "dict"}
    timeout_seconds: 1800
    safety_classification: passive
    tier: 1

  - name: theharvester
    agent_class: TheHarvesterAgent
    category: osint_email_discovery
    execution_mode: native
    binary_path: theHarvester
    install_verification_cmd: ["theHarvester", "-h"]
    input_schema: {"target": "domain"}
    output_schema: {"emails": "list[str]", "hosts": "list[str]"}
    timeout_seconds: 600
    safety_classification: passive
    tier: 1

  # Network Enumeration
  - name: masscan
    agent_class: MasscanAgent
    category: network_port_scanning
    execution_mode: native
    binary_path: masscan
    install_verification_cmd: ["masscan", "--version"]
    input_schema: {"target": "cidr_or_ip", "ports": "list[int]"}
    output_schema: {"open_ports": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
    requires_root: true

  - name: nmap
    agent_class: NmapAgent
    category: network_enumeration
    execution_mode: native
    binary_path: nmap
    install_verification_cmd: ["nmap", "--version"]
    input_schema: {"target": "ip_or_host", "ports": "list[int]"}
    output_schema: {"services": "list[dict]", "os_info": "dict"}
    timeout_seconds: 900
    safety_classification: active
    tier: 1

  - name: naabu
    agent_class: NaabuAgent
    category: network_port_scanning
    execution_mode: native
    binary_path: naabu
    install_verification_cmd: ["naabu", "-version"]
    input_schema: {"target": "ip_or_fqdn"}
    output_schema: {"open_ports": "list[dict]"}
    timeout_seconds: 240
    safety_classification: active
    tier: 1

  - name: httpx
    agent_class: HttpxAgent
    category: http_service_enumeration
    execution_mode: native
    binary_path: httpx
    install_verification_cmd: ["httpx", "-version"]
    input_schema: {"target": "list[str]"}
    output_schema: {"live_hosts": "list[dict]"}
    timeout_seconds: 180
    safety_classification: active
    tier: 1

  # Web Discovery
  - name: gau
    agent_class: GauAgent
    category: web_discovery
    execution_mode: native
    binary_path: gau
    install_verification_cmd: ["gau", "--version"]
    input_schema: {"target": "domain"}
    output_schema: {"urls": "list[str]"}
    timeout_seconds: 900
    safety_classification: passive
    tier: 1

  - name: katana
    agent_class: KatanaAgent
    category: web_crawling
    execution_mode: native
    binary_path: katana
    install_verification_cmd: ["katana", "-version"]
    input_schema: {"target": "url"}
    output_schema: {"endpoints": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: active
    tier: 1

  - name: arjun
