# secrets_cache.yaml — Audit reference for SecretsCacheManager constraints.
# NOT loaded at runtime. Edit secrets_cache.py to change enforced values.
#
# Threat categories:
#   DUMP  — plaintext exposure via memory dump or core file
#   STALE — serving revoked/rotated credentials after Vault update
#   DOS   — cache exhaustion / memory exhaustion attack
#   SSRF  — unintended internal network reach via crafted secret values
#   TENANT — cross-tenant secret leakage in multi-tenant deployments

encryption:
  algorithm: XSalsa20-Poly1305 (NaCl SecretBox)
  key_size_bytes: 32
  key_source: SECRETS_CACHE_KEY_HEX environment variable
  threat_mitigated: DUMP
  notes: >
    Ciphertext stored as bytearray; overwritten with os.urandom() on eviction or
    shutdown.  Post-decrypt plaintext is a Python str (immutable) — it cannot be
    reliably wiped due to Python's memory model.  Callers must not store the
    decrypted value; use it inline before yielding control.

ttl:
  # All values in seconds.
  api_key:     300    # 5 min — typical rotation window for SaaS API keys
  password:    180    # 3 min — shorter window; passwords are high-value targets
  token:       300    # 5 min — OAuth/session tokens
  certificate: 3600   # 1 hr  — X.509 certs are expensive to re-fetch
  dynamic:     60     # 1 min — Vault-leased dynamic secrets; always cap by lease_duration
  threat_mitigated: STALE
  notes: >
    For DYNAMIC secrets, effective_ttl = min(type_ttl, lease_duration - 30s).
    The 30-second safety margin prevents serving a credential that Vault has
    already revoked.  Callers that receive a Vault lease_duration should pass it
    to SecretsCacheManager.set().

lru_eviction:
  max_size: 1000        # maximum concurrent cached entries
  policy: LRU           # least-recently-used entry evicted when full
  eviction_wipe: true   # bytearray overwritten with os.urandom() before del
  threat_mitigated: DOS
  notes: >
    An attacker who can trigger many distinct secret fetches (e.g. via crafted
    tenant_ids or secret names) can fill the cache and force LRU eviction of
    legitimate entries.  max_size caps the impact to O(max_size) entries and
    O(max_size * avg_ciphertext_bytes) memory.

tenant_isolation:
  mechanism: cache key prefix "{tenant_id}:{secret_name}"
  invalidation: invalidate_tenant(tenant_id) wipes all entries for that prefix
  threat_mitigated: TENANT
  notes: >
    tenant_id is caller-supplied.  The cache does not validate that the caller
    has permission to access secrets for that tenant — authorisation must happen
    upstream (SecretManager callers / FastAPI dependency injection).

memory_safety:
  ciphertext_type: bytearray
  wipe_method: os.urandom() overwrite then bytearray() reassignment
  plaintext_type: str (immutable, may be interned by CPython)
  plaintext_wipe: NOT POSSIBLE — Python language limitation; documented above
  shutdown_wipe: shutdown() wipes all entries (register with atexit or lifespan)
  threat_mitigated: DUMP

observability:
  metrics:
    - hits          # cache hit count
    - misses        # cache miss count (includes TTL expiry)
    - hit_rate      # hits / (hits + misses)
    - evictions     # LRU eviction count
    - wipes         # bytearray overwrite count (evictions + explicit invalidations)
    - size          # current entry count
    - max_size      # configured limit
  access: SecretsCacheManager.stats (dict) or .log_stats() (INFO log)
  audit_log: >
    All Vault reads are logged at DEBUG level via secret_manager.py.
    Cache hits are logged at DEBUG.  Never log secret values.

vault_integration:
  retry_logic: VaultClient._retry_operation (exponential backoff, max 3 attempts)
  dynamic_secrets: >
    Pass lease_duration from Vault response to SecretsCacheManager.set().
    Pre-expiration invalidation: call invalidate() when Vault issues a renewal
    or rotation event.  Full Vault dynamic-secret engine support (DB creds,
    AWS STS) is out of scope for the cache layer.
  token_refresh: >
    On VaultConnectionError after retries exhausted, call invalidate_all() to
    force re-fetch after token refresh so stale credentials are not served.
