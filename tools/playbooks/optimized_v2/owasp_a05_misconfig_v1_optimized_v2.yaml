playbook:
  metadata:
    name: OWASP A05 Security Misconfiguration Assessment (High-Frequency Optimized
      v2)
    id: owasp_a05_misconfig_v1_optimized_v2
    version: '2.0'
    base_playbook_id: owasp_a05_misconfig_v1
    category: OWASP Exploitation
    optimization_focus: High-frequency vulnerability patterns by target archetype
    scope_lock_required: true
  optimization_baseline:
    baseline_execution_minutes: 60
    optimized_execution_minutes: 20
    baseline_success_rate: 0.85
    optimized_success_rate: 0.92
    expected_time_reduction_percent: 66.7
    expected_success_uplift_percent: 8.2
  pre_execution_target_classification:
    required_playbooks:
    - target_fingerprinter_v1
    - archetype_classifier_v1
    - vulnerability_predictor_v1
    required_outputs:
    - target_archetype
    - confidence_score
    - recommended_top_playbooks
    scope_validation_first: true
  target_aware_routing:
    startup:
      exploitation_patterns:
      - default_credential_surface
      - debug_mode_exposure
      - missing_security_headers_combo
      timeout_seconds: 180
      expected_success_rate: 0.95
      execution_mode: high_frequency_only
    enterprise:
      exploitation_patterns:
      - segmentation_misconfig_check
      - admin_surface_exposure
      - tls_policy_drift_check
      timeout_seconds: 300
      expected_success_rate: 0.95
      execution_mode: high_frequency_only
    government:
      exploitation_patterns:
      - hardened_baseline_drift
      - restricted_service_exposure_validation
      timeout_seconds: 480
      expected_success_rate: 0.78
      execution_mode: high_frequency_only
  execution_logic:
    selection_rule: Use target archetype route; execute only listed high-frequency
      patterns.
    early_exit: Stop on first validated critical/high finding or after pattern list
      exhausted.
    fallback: If archetype unknown, run startup route with enterprise timeout.
  optimization_rationale: Original playbook 'owasp_a05_misconfig_v1' executed broad
    pattern sets. v2 reduces low-probability pattern execution and targets high-frequency
    misconfiguration paths for startup/enterprise/government archetypes using Prompt
    5 frequency intelligence.
