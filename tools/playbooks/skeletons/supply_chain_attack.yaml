  - CVE-2019-18218
  - CVE-2020-13945
  distributed_across_types:
  - RCE
  - Auth-Bypass
  - LPE
  - Data-Breach
  - Web-API
attack_sequence:
  step_1:
    title: Initialize
    executor_persona: supply_chain_mapper
    input: From input_source
    output: Ready for step_2
  step_2:
    title: Execute
    executor_persona: proof_of_concept_generator
