[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["apps", "modules"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "tests/test_dorks_hil.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "F401", "F841"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
exclude = "(tests/test_dorks_hil\\.py)"
