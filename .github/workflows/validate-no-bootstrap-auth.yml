name: Validate Bootstrap Auth Hardened Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-bootstrap-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip

      - name: Run bootstrap env validation
        run: python scripts/validate_bootstrap_env.py --check-env

      - name: Build backend image with bootstrap disabled
        run: |
          docker build --build-arg K1_ENABLE_BOOTSTRAP_AUTH_BUILD=false -f Dockerfile.backend -t kai-backend-scan .

      - name: Assert image does not contain forbidden bootstrap env vars
        run: |
          if docker inspect kai-backend-scan --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E '^(K1_ENABLE_BOOTSTRAP_AUTH|K1_DEV_TOKEN)=' >/dev/null; then
            echo 'ERROR: Forbidden bootstrap environment variables were found in the built image.'
            exit 1
          fi
          echo 'OK: built image does not include forbidden bootstrap variables.'
