playbook:
  metadata:
    name: 'Detection Profile: SQL Injection Discovery and Validation (Optimized Detection
      v2)'
    id: det_sql_injection_v1_optimized_v2
    version: '2.0'
    base_detection_playbook_id: det_sql_injection_v1
    operation_type: detection_only
    scope_lock_required: true
    non_destructive_only: true
  guardrails:
    forbidden_operations:
    - exploitation
    - persistence
    - destruction
    - evasion
    - lateral_movement
    required_preconditions:
    - authorized_scope_verified
    - opportunity_active
    - safe_mode_enabled
    reporting_mode: proof_of_concept_evidence_only
  optimization_baseline:
    baseline_execution_minutes: 16
    optimized_execution_minutes: 6
    baseline_network_requests: 352
    optimized_network_requests: 169
    time_reduction_percent: 62.5
    noise_reduction_percent: 51.99
  target_aware_scanning_strategy:
    early_stage_saas:
      detection_patterns:
      - boolean_blind_sqli_detection
      - time_based_sqli_detection
      - orm_query_injection_probe
      scan_depth: thorough
      timeout_seconds: 17
      max_requests: 128
      expected_detection_probability: 0.1814
    enterprise_multi_property:
      detection_patterns:
      - legacy_query_interface_sqli_probe
      - second_order_sqli_detection
      - long_window_blind_sqli_probe
      scan_depth: moderate
      timeout_seconds: 26
      max_requests: 112
      expected_detection_probability: 0.1641
    fintech_regulated:
      detection_patterns:
      - strict_input_boundary_sqli_detection
      - inference_sqli_probe
      scan_depth: deep
      timeout_seconds: 38
      max_requests: 96
      expected_detection_probability: 0.1555
  execution_logic:
    selection_rule: Classify target archetype, then execute only listed high-frequency
      detection patterns.
    batching: Group compatible endpoint checks by route to reduce duplicate requests.
    early_stop: Stop when confidence threshold reached for vulnerability reportability.
    fallback: If archetype unknown, use early_stage_saas patterns with enterprise
      timeout.
  optimization_rationale: Focuses scanning effort on high-frequency-detection vectors
    and removes low-probability pattern sweeps to reduce time and network noise while
    preserving finding quality.
