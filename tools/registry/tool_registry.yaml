    install_verification_cmd: ["dnsx", "-version"]
    input_schema: {"target": "host_or_domain"}
    output_schema: {"records": "list[json]"}
    timeout_seconds: 180
    safety_classification: passive

  - name: gau
    agent_class: GauAgent
