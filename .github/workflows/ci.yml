name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        env:
          PYTHONPATH: .
        run: python -m ruff check apps/backend modules tests

      - name: Format
        env:
          PYTHONPATH: .
        run: |
          python -m black --check apps/backend modules tests
          python -m isort --check-only apps/backend modules tests

      - name: Type check
        env:
          PYTHONPATH: .
        run: python -m mypy apps/backend/src modules tests

      - name: Validate claims registry
        run: python scripts/validate_claims.py

      - name: Run deterministic benchmarks (claims gate)
        run: python scripts/run_benchmarks.py --verify-claims

      - name: Toolpack adapter compatibility gate
        env:
          PYTHONPATH: .
          K1_TEST_MODE: "true"
        run: python scripts/check_toolpack_adapter_compat.py

      - name: Secret manager unmanaged-read gate
        run: python scripts/check_unmanaged_secrets.py

      - name: Non-bypassability gate
        run: python scripts/check_non_bypassability.py

      - name: Tests with coverage
        env:
          PYTHONPATH: .
          K1_DEV_TOKEN: test-token
          K1_TEST_MODE: "true"
        run: python -m pytest --cov=apps/backend/src --cov-report=xml --cov-fail-under=60

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
        continue-on-error: true

      - name: Security — Bandit SAST
        env:
          PYTHONPATH: .
        run: |
          python -m pip install bandit[toml] --quiet
          python -m bandit -r apps/backend/src -ll -x apps/backend/src/tests || true

      - name: Security — pip-audit
        run: |
          python -m pip install pip-audit --quiet
          python -m pip-audit --requirement requirements.txt --ignore-vuln GHSA-34jh-p97f-mpxf || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: apps/frontend
        run: npm install

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint --if-present || true

      - name: Type check
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: apps/frontend
        run: npm run build

      - name: Security — npm audit
        working-directory: apps/frontend
        run: npm audit --audit-level=high || true
