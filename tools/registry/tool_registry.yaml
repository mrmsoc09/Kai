    output_schema: {"intel_registry": "list[json]"}
    timeout_seconds: 600
    safety_classification: passive
    tags: ["RECON_PASSIVE", "passive_discovery", "one-agent-one-tool"]
    dependencies: ["provider-config.yaml"]
    api_keys_required: ["CHAOS_API_KEY", "GITHUB_TOKEN", "SHODAN_API_KEY", "TRILIUM_FREE_TIER_API_KEY"]

  - name: dnsx
    agent_class: DnsxAgent
    category: recon_asset_discovery
    execution_mode: native
    binary_path: dnsx
    install_verification_cmd: ["dnsx", "-version"]
    input_schema: {"target": "host_or_domain"}
    output_schema: {"records": "list[json]"}
    timeout_seconds: 180
    safety_classification: passive

  - name: gau
    agent_class: GauAgent
