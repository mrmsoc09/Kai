playbook:
  metadata:
    name: LLM Training Data Poisoning & Prompt Injection Chains (High-Frequency Optimized
      v2)
    id: llm_poisoning_v1_optimized_v2
    version: '2.0'
    base_playbook_id: llm_poisoning_v1
    category: AI/LLM
    optimization_focus: High-frequency vulnerability patterns by target archetype
    scope_lock_required: true
  optimization_baseline:
    baseline_execution_minutes: 30
    optimized_execution_minutes: 10
    baseline_success_rate: 0.52
    optimized_success_rate: 0.69
    expected_time_reduction_percent: 66.7
    expected_success_uplift_percent: 32.7
  pre_execution_target_classification:
    required_playbooks:
    - target_fingerprinter_v1
    - archetype_classifier_v1
    - vulnerability_predictor_v1
    required_outputs:
    - target_archetype
    - confidence_score
    - recommended_top_playbooks
    scope_validation_first: true
  target_aware_routing:
    startup:
      exploitation_patterns:
      - direct_prompt_injection
      - system_prompt_leak_check
      - rag_context_poisoning
      timeout_seconds: 180
      expected_success_rate: 0.79
      execution_mode: high_frequency_only
    enterprise:
      exploitation_patterns:
      - tool_call_policy_bypass
      - cross_agent_context_escape
      - tenant_memory_bleed_probe
      timeout_seconds: 300
      expected_success_rate: 0.72
      execution_mode: high_frequency_only
    government:
      exploitation_patterns:
      - safety_policy_override_attempt
      - high_assurance_prompt_boundary_check
      timeout_seconds: 480
      expected_success_rate: 0.59
      execution_mode: high_frequency_only
  execution_logic:
    selection_rule: Use target archetype route; execute only listed high-frequency
      patterns.
    early_exit: Stop on first validated critical/high finding or after pattern list
      exhausted.
    fallback: If archetype unknown, run startup route with enterprise timeout.
  optimization_rationale: Original playbook 'llm_poisoning_v1' executed broad pattern
    sets. v2 reduces low-probability pattern execution and targets high-frequency
    ai_llm paths for startup/enterprise/government archetypes using Prompt 5 frequency
    intelligence.
