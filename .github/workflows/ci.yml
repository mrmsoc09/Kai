name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-quality:
    name: Backend Quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    env:
      PYTHONPATH: .
      K1_TEST_MODE: "true"
      # K1_DEV_TOKEN intentionally omitted — tests must authenticate via /auth/login

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint and format checks
        run: bash scripts/check_backend_quality.sh --lint-only

      - name: Run tests
        run: bash scripts/check_backend_quality.sh --tests-only

  secret-scan:
    name: Secret Scan (truffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.94.2
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
