name: Secrets Scan & Vault Injection Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Block pushes that contain hardcoded credentials ──────────────────
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so TruffleHog can diff commits

      - name: Run TruffleHog (verified secrets only)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >-
            --only-verified
            --exclude-paths .trufflehog-exclude.txt

  # ── Job 2: Validate compose files contain no inline plaintext credentials ───
  validate-compose-secrets:
    name: Validate Compose File Has No Hardcoded Credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check docker-compose.yml for hardcoded credentials
        run: |
          # Fail if any env var in compose is set to a literal value that looks
          # like a password, token, or API key (i.e. not a ${VAR} reference).
          if grep -nE \
            "(PASSWORD|SECRET|TOKEN|API_KEY|_PASS)[[:space:]]*=[^$#\n][^{]" \
            docker-compose.yml; then
            echo ""
            echo "ERROR: docker-compose.yml contains hardcoded credentials."
            echo "All secrets must use \${VAR} interpolation."
            exit 1
          fi
          echo "OK: no hardcoded credentials found in docker-compose.yml"

      - name: Confirm required vars are placeholders in .env.example
        run: |
          # Ensure .env.example does not contain production-looking real secrets
          # (it should have replace-with-* or empty values for secrets).
          BAD=$(grep -nE \
            "(PASSWORD|SECRET|TOKEN|API_KEY)=[^r$\n][^e][^p][^l][^a]" \
            .env.example | grep -vE "replace-with-|your_[a-z_]+_api|^#" || true)
          if [ -n "$BAD" ]; then
            echo "WARNING: .env.example may contain non-placeholder secret values:"
            echo "$BAD"
          fi

  # ── Job 3: detect-secrets baseline audit ────────────────────────────────────
  detect-secrets-audit:
    name: detect-secrets Baseline Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Audit against baseline
        run: |
          detect-secrets audit --report --fail-on-unaudited \
            --baseline .secrets.baseline || {
            echo ""
            echo "New secrets detected that are not in the baseline."
            echo "Run: detect-secrets scan > .secrets.baseline && git add .secrets.baseline"
            exit 1
          }

  # ── Job 4 (example): Vault secret injection at deployment time ──────────────
