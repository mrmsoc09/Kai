          name: "Fortinet FortiGate"
          frequency_in_archetype: 0.82
          rationale: "FortiGate dominant in government perimeter; slow patch cycle"
        - rank: 3
          cve_id: "CVE-2024-3400"
          name: "Palo Alto PAN-OS"
          frequency_in_archetype: 0.85
          rationale: "PAN-OS dominant in government; APT-targeted zero-day"
        - rank: 4
          cve_id: "CVE-2023-29357"
          name: "SharePoint Auth Bypass"
          frequency_in_archetype: 0.72
          rationale: "Microsoft SharePoint near-universal in government document management"

      success_metrics:
        expected_success_rate: 0.22
        median_compromise_time_minutes: 480
        primary_success_vectors:
          - "VPN/perimeter device CVEs (80% of successful intrusions)"
          - "Supply chain attacks (15% of successful intrusions)"
          - "Zero-day exploitation (5%)"
        notes: "Standard playbooks fail. Success requires chaining perimeter device CVEs + living-off-the-land."
        source: "Mandiant M-Trends 2024; CISA Threat Intelligence reports"

  ################################################################################
  # CROSS-ARCHETYPE COMPARISON MATRIX
  ################################################################################

  cross_archetype_comparison:

    success_rate_by_archetype:
      startup: 0.82
      mid_market: 0.70
      enterprise: 0.58
