services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: k1_pg
    environment:
      POSTGRES_DB: k1
      POSTGRES_USER: k1
      POSTGRES_PASSWORD: k1pass
    ports:
      - "5432:5432"
    volumes:
      - k1_pg_data:/var/lib/postgresql/data
      - ../data/schemas/pgvector_schema.sql:/docker-entrypoint-initdb.d/01_pgvector_schema.sql:ro

  qdrant:
    image: qdrant/qdrant:latest
    container_name: k1_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - k1_qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: k1_redis
    ports:
      - "6379:6379"

  vault:
    image: hashicorp/vault:1.15
    container_name: k1_vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id=root -dev-listen-address=0.0.0.0:8200
    ports:
      - "8200:8200"

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: k1_jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "14268:14268"
      - "14250:14250"
      - "4317:4317"
      - "4318:4318"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    container_name: k1_es
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - k1_es_data:/usr/share/elasticsearch/data

  cassandra:
    image: cassandra:4.1
    container_name: k1_cassandra
    ports:
      - "9042:9042"
    volumes:
      - k1_cassandra:/var/lib/cassandra

  thehive:
    image: strangebee/thehive:5.2
    container_name: k1_thehive
    depends_on:
      - elasticsearch
      - cassandra
    environment:
      TH_DATABASE__HOSTS: cassandra
      TH_SEARCH__ELASTICSEARCH__URL: http://elasticsearch:9200
    ports:
      - "9000:9000"
    volumes:
      - k1_thehive:/opt/thehive/data

  backend:
    build:
      context: ..
      dockerfile: apps/backend/hil_api/Dockerfile
    container_name: k1_backend
    environment:
      DATABASE_URL: postgresql://k1:k1pass@postgres:5432/k1
      ADMIN_API_KEY: admin_secret_key_default
      USER_API_KEY: user_secret_key_default
      THEHIVE_URL: http://thehive:9000
      THEHIVE_API_KEY: changeme
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      - postgres
      - thehive
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    container_name: k1_frontend
    depends_on:
      - backend
    ports:
      - "8081:8081"

volumes:
  k1_pg_data: {}
  k1_qdrant: {}
  k1_es_data: {}
  k1_cassandra: {}
  k1_thehive: {}
