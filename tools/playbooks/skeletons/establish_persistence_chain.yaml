  cluster: PERSISTENCE
  complexity: HIGH
  created: '2026-04-12T02:45:29.792496'
objective:
  primary: 'Execute persistence phase: establish_persistence_chain'
  secondary:
  - Minimize detection
  - Enable adaptive pivoting
  - Prepare next phase
inputs_and_sources:
  input_source: rce_chain, auth_bypass_chain, privilege_escalation_chain, physical_exploitation
  required_input:
  - target_profile
  - recon_data
outputs_and_targets:
  primary_output_target: lateral_movement_chain
  fallback_target: log_removal_chain
  alternate_targets:
  - data_exfiltration_chain
cve_bindings:
  count: 5
  cves:
  - CVE-2023-50290
  - CVE-2024-20567
  - CVE-2024-21345
  - CVE-2024-20456
  - CVE-2023-50298
  distributed_across_types:
  - RCE
  - Auth-Bypass
  - LPE
  - Data-Breach
  - Web-API
attack_sequence:
  step_1:
    title: Initialize
    executor_persona: proof_of_concept_generator
    input: From input_source
    output: Ready for step_2
  step_2:
    title: Execute
    executor_persona: lateral_movement_planner
    input: From step_1
    output: To step_3
