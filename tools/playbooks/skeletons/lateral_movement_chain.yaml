  - CVE-2024-20889
  - CVE-2024-21998
  - CVE-2024-20999
  - CVE-2023-50287
  distributed_across_types:
  - RCE
  - Auth-Bypass
  - LPE
  - Data-Breach
  - Web-API
attack_sequence:
  step_1:
    title: Initialize
    executor_persona: lateral_movement_planner
    input: From input_source
    output: Ready for step_2
  step_2:
    title: Execute
    executor_persona: privilege_escalation_specialist
