        - chain-exploit-privilege-escalation-01
        - chain-persist-lateral-movement-01

  ################################################################################
  # TARGET FINGERPRINTING SIGNATURES
  ################################################################################

  fingerprinting_signatures:
    # Used by the orchestrator to classify unknown targets into archetypes

    startup_indicators:
      - "Auth0 / Firebase Auth in HTTP responses"
      - "React/Vue SPA frontend (npm/vite build artifacts)"
      - "Stripe/Twilio API endpoints in JS"
      - "AWS Load Balancer headers"
      - "Docker container hints in error messages"
      - "GitHub Actions CI fingerprints"
      - "Heroku/Vercel/Railway deployment signatures"
