playbook:
  metadata:
    name: GraphQL API Security Validation (High-Frequency Optimized v2)
    id: graphql_attacks_v1_optimized_v2
    version: '2.0'
    base_playbook_id: graphql_attacks_v1
    category: Exploitation
    optimization_focus: High-frequency vulnerability patterns by target archetype
    scope_lock_required: true
  optimization_baseline:
    baseline_execution_minutes: 40
    optimized_execution_minutes: 13
    baseline_success_rate: 0.8
    optimized_success_rate: 0.92
    expected_time_reduction_percent: 67.5
    expected_success_uplift_percent: 15.0
  pre_execution_target_classification:
    required_playbooks:
    - target_fingerprinter_v1
    - archetype_classifier_v1
    - vulnerability_predictor_v1
    required_outputs:
    - target_archetype
    - confidence_score
    - recommended_top_playbooks
    scope_validation_first: true
  target_aware_routing:
    startup:
      exploitation_patterns:
      - graphql_introspection_authz
      - bola_endpoint_swap
      - mass_assignment_abuse
      timeout_seconds: 180
      expected_success_rate: 0.95
      execution_mode: high_frequency_only
    enterprise:
      exploitation_patterns:
      - api_gateway_policy_bypass
      - schema_privilege_confusion
      - rate_limit_logic_bypass
      timeout_seconds: 300
      expected_success_rate: 0.95
      execution_mode: high_frequency_only
    government:
      exploitation_patterns:
      - contract_mismatch_authz_check
      - endpoint_trust_boundary_validation
      timeout_seconds: 480
      expected_success_rate: 0.78
      execution_mode: high_frequency_only
  execution_logic:
    selection_rule: Use target archetype route; execute only listed high-frequency
      patterns.
    early_exit: Stop on first validated critical/high finding or after pattern list
      exhausted.
    fallback: If archetype unknown, run startup route with enterprise timeout.
  optimization_rationale: Original playbook 'graphql_attacks_v1' executed broad pattern
    sets. v2 reduces low-probability pattern execution and targets high-frequency
    api paths for startup/enterprise/government archetypes using Prompt 5 frequency
    intelligence.
