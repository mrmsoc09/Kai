apiVersion: apps/v1
kind: Deployment
metadata:
  name: k1-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k1-frontend
  template:
    metadata:
      labels:
        app: k1-frontend
    spec:
      containers:
      - name: frontend
        image: k1/frontend:dev
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: k1-frontend
spec:
  selector:
    app: k1-frontend
  ports:
  - port: 80
    targetPort: 80
