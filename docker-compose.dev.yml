version: '3.8'

# K1 Local Development Environment
# Start with: docker-compose -f docker-compose.dev.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: k1_postgres
    environment:
      POSTGRES_USER: k1
      POSTGRES_PASSWORD: k1password
      POSTGRES_DB: k1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k1_network
    restart: unless-stopped

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: k1_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k1_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: k1_backend
    environment:
      DEBUG_MODE: "true"
      ENVIRONMENT: development
      K1_DEV_TOKEN: k1-dev-token-docker
      DATABASE_URL: postgresql://k1:k1password@postgres:5432/k1
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      LLM_PROVIDER: anthropic
      K1_PATCH_LLM_MODEL: claude-opus-4-5
      CORS_ALLOWED_ORIGINS: "http://localhost:8081,http://localhost:3000,http://127.0.0.1:8081"
      CORS_ALLOW_CREDENTIALS: "true"
      K1_RATELIMIT_BACKEND: memory
      LOG_LEVEL: DEBUG
      FEATURE_PATCH_ENGINE: "true"
      FEATURE_AUTO_VALIDATION: "true"
      OSINT_ENABLED: "true"
      EXTERNAL_QUERIES_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        pip install -q -r requirements.txt &&
        python3 -m uvicorn apps.backend.src.main:app --host 0.0.0.0 --port 8080 --reload
      "
    networks:
      - k1_network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: k1_worker
    environment:
      REDIS_URL: redis://redis:6379/0
      SHODAN_API_KEY: ${SHODAN_API_KEY:-}
      # Align PATH for Go-installed binaries inside the worker
      PATH: "/root/go/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/go/bin"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - ./artifacts:/app/artifacts
    networks:
      - k1_network
    restart: unless-stopped

  # React Frontend
  frontend:
    image: node:18-alpine
    container_name: k1_frontend
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:5173"
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host
      "
    depends_on:
      - backend
    networks:
      - k1_network
    restart: unless-stopped

  # Mailhog for Email Testing (optional)
  mailhog:
    image: mailhog/mailhog:latest
    container_name: k1_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - k1_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  k1_network:
    driver: bridge
