    ################################################################################

    - id: "archetype_government"
      name: "Government / Critical Infrastructure / Regulated Industry"
      description: "Hardened systems, multi-layer security, sophisticated adversaries (APT focus), compliance-heavy"
      characteristics:
        employee_count: "500-50,000"
        it_maturity: "Very High"
        security_investment_annual: "$10M-$500M"
        dedicated_security_staff: "10-500+"
        adversary_profile: "Nation-state APTs, sophisticated criminal groups"
        security_controls:
          siem: "yes (dedicated SOC)"
          edr: "yes (government-grade)"
          waf: "yes"
          mfa: "mandatory (PIV/CAC cards in US Gov)"
          pam: "yes"
          network_segmentation: "strict"
          zero_trust: "implementing (US Fed CISA directive)"
          air_gapped_systems: "yes (for classified)"
          compliance: ["FedRAMP", "FISMA", "NIST 800-53", "CMMC", "ITAR"]

      technology_stack:
        backend_frameworks:
          - name: "Legacy Java (J2EE)"
            prevalence: 0.48
          - name: "Legacy .NET Framework"
            prevalence: 0.42
          - name: "COBOL (mainframe)"
            prevalence: 0.25
          - name: "Custom/classified applications"
            prevalence: 0.30
        databases:
          - name: "Oracle (enterprise)"
            prevalence: 0.55
          - name: "MSSQL"
            prevalence: 0.35
        security_products:
          - "Palo Alto Networks (firewalls)"
          - "Fortinet FortiGate"
          - "Cisco ASA/Firepower"
          - "Ivanti EPMM/Neurons"
          - "CrowdStrike Falcon"

      vulnerability_distribution:
