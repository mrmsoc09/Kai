version: '3.8'

# K1 Local Development Environment
# Start with: ./k1 start

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: k1_postgres
    environment:
      POSTGRES_USER: k1
      POSTGRES_PASSWORD: k1password
      POSTGRES_DB: k1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k1_network
    restart: unless-stopped

  # HashiCorp Vault for Secure Secret Management
  vault:
    image: vault:1.13.3
    container_name: k1_vault
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - ./scripts/vault-entrypoint.sh:/vault/scripts/entrypoint.sh:ro
      - vault_data:/vault/file:rw
    entrypoint: ["/bin/sh", "/vault/scripts/entrypoint.sh"]
    cap_add:
      - IPC_LOCK
    networks:
      - k1_network
    restart: unless-stopped

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: k1_redis
    command: redis-server --appendonly yes --requirepass K1_SecR3tP4ssw0rd!_2026
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - k1_network
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: k1_backend
    env_file: .env
    environment:
      DEBUG_MODE: "true"
      ENVIRONMENT: development
      PYTHONUNBUFFERED: 1
      PYTHONPATH: /app
      VAULT_URL: http://vault:8200
      REDIS_URL: "redis://:K1_SecR3tP4ssw0rd!_2026@redis:6379/0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./artifacts:/app/artifacts:rw
      - ./apps:/app/apps:ro
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    command: >
      sh -c "
        python3 -m uvicorn apps.backend.src.main:app --host 0.0.0.0 --port 8080
      "
    networks:
      - k1_network
    restart: unless-stopped

  # Celery Worker for Tool Execution (OSINT / Vulnerability Scanning)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: k1_worker
    env_file: .env
    environment:
      PYTHONPATH: /app
      VAULT_URL: http://vault:8200
      REDIS_URL: "redis://:K1_SecR3tP4ssw0rd!_2026@redis:6379/0"
      # Align PATH for Go-installed binaries inside the worker
      PATH: "/root/go/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/go/bin"
    depends_on:
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    volumes:
      - ./artifacts:/app/artifacts:rw
      - ./apps:/app/apps:ro
      - ./config:/app/config:ro
    networks:
      - k1_network
    restart: unless-stopped
    command: >
      sh -c "
        celery -A apps.backend.src.worker.celery_app.celery_app worker -Q tools,intrusive --loglevel=info
      "

  # React Frontend (Kaison Composer UI)
  frontend:
    image: node:22-alpine
    container_name: k1_frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:8081"
    volumes:
      - ./apps/frontend-operator:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install &&
        npm run dev -- --hostname 0.0.0.0 --port 8081
      "
    depends_on:
      - backend
    networks:
      - k1_network
    restart: unless-stopped

  # Mailhog for Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: k1_mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - k1_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  k1_network:
    driver: bridge
