name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend-quality:
    name: Backend Quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    env:
      PYTHONPATH: .
      K1_TEST_MODE: "true"
      K1_DEV_TOKEN: "ci-token"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint and format checks
        run: bash scripts/check_backend_quality.sh --lint-only

      - name: Run tests
        run: bash scripts/check_backend_quality.sh --tests-only
