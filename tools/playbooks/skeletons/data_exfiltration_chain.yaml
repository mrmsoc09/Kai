metadata:
  name: Data Exfiltration Chain
  id: data_exfiltration_chain
  version: '1.0'
  cluster: PERSISTENCE
  complexity: MEDIUM
  created: '2026-04-12T02:45:29.824838'
objective:
  primary: 'Execute persistence phase: data_exfiltration_chain'
  secondary:
  - Minimize detection
  - Enable adaptive pivoting
  - Prepare next phase
inputs_and_sources:
  input_source: lateral_movement_chain, database_exploitation, api_abuse_chain
  required_input:
  - target_profile
  - recon_data
outputs_and_targets:
  primary_output_target: log_removal_chain
  fallback_target: long_game_persistence_chain
  alternate_targets: []
cve_bindings:
  count: 5
  cves:
  - CVE-2024-22567
  - CVE-2024-20678
  - CVE-2023-50286
  - CVE-2024-22089
  - CVE-2024-21999
  distributed_across_types:
  - RCE
  - Auth-Bypass
  - LPE
  - Data-Breach
  - Web-API
attack_sequence:
  step_1:
    title: Initialize
    executor_persona: credential_extractor
    input: From input_source
    output: Ready for step_2
  step_2:
    title: Execute
    executor_persona: osint_orchestrator
    input: From step_1
    output: To step_3
  step_3:
    title: Validate
    executor_persona: credential_extractor
    input: From step_2
    output: Success or fallback
decision_branches:
- condition: If execution succeeds
  action: Call log_removal_chain
- condition: If execution fails
  action: Call long_game_persistence_chain
- condition: If detected
  action: Call incident_responder_evasion or detection_evasion
cross_link_graph:
  calls_these_playbooks:
  - log_removal_chain
  called_by_these_playbooks:
  - api_abuse_chain
  - database_exploitation
  - llm_model_poisoning
  - establish_persistence_chain
  - insider_threat_activation
  can_pivot_to:
  - log_removal_chain
  - long_game_persistence_chain
  is_entry_point: false
  is_terminal: false
personas_assigned:
- credential_extractor
- osint_orchestrator
