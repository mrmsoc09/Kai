    asn_info: "list[dict]"
  priority_boost_if_goals: [subdomain_enumeration, asset_discovery]
  priority_boost_value: 1.4

dnsx:
  phase_affinity: [recon, enumeration]
  dependencies: [subdomains]
  estimated_cost_cents: 0
  execution_time_estimate_ms: 20000
  output_schema:
    resolved_subdomains: "list[str]"
    dns_records: "list[dict]"
  priority_boost_if_goals: [dns_resolution, subdomain_enumeration]
  priority_boost_value: 1.3

