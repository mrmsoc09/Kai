version: '3.8'

x-kai-artifacts-env: &kai_artifacts_env
  K1_ARTIFACTS_ROOT: ${K1_ARTIFACTS_CONTAINER_ROOT:-/tmp/kai-artifacts}
  K1_NMAP_OUTPUT_DIR: ${K1_ARTIFACTS_CONTAINER_ROOT:-/tmp/kai-artifacts}/nmap-output
  K1_NUCLEI_OUTPUT_DIR: ${K1_ARTIFACTS_CONTAINER_ROOT:-/tmp/kai-artifacts}/nuclei-output
  K1_GITLEAKS_OUTPUT_DIR: ${K1_ARTIFACTS_CONTAINER_ROOT:-/tmp/kai-artifacts}/gitleaks-output
  K1_BURP_CACHE_DIR: ${K1_ARTIFACTS_CONTAINER_ROOT:-/tmp/kai-artifacts}/burp-cache
  K1_CACHE_DIR: /home/kai/.cache
  XDG_CACHE_HOME: /home/kai/.cache

x-kai-artifacts-volumes: &kai_artifacts_volumes
  - type: bind
    source: ${KAI_STORAGE_ROOT:-/srv/kai}/artifacts
    target: ${K1_ARTIFACTS_CONTAINER_ROOT:-/tmp/kai-artifacts}
    read_only: false
  - type: bind
    source: ${KAI_STORAGE_ROOT:-/srv/kai}/artifacts/nmap-output
    target: /tmp/nmap-output
    read_only: false
  - type: bind
    source: ${KAI_STORAGE_ROOT:-/srv/kai}/artifacts/nuclei-output
    target: /tmp/nuclei-output
    read_only: false
  - type: bind
    source: ${KAI_STORAGE_ROOT:-/srv/kai}/artifacts/gitleaks-output
    target: /tmp/gitleaks-output
    read_only: false
  - type: bind
    source: ${KAI_STORAGE_ROOT:-/srv/kai}/artifacts/burp-cache
    target: /tmp/burp-cache
    read_only: false
  - type: bind
    source: ${KAI_STORAGE_ROOT:-/srv/kai}/artifacts/cache
    target: /home/kai/.cache
    read_only: false

networks:
  kai_internal:
    driver: bridge
  kai_admin:
    driver: bridge

services:
  # Core Kai Services (Placeholders for now)
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: kai-orchestrator
    container_name: kai_orchestrator
    environment:
      # Compose constructs the internal URL using the postgres hostname (not localhost).
      # The DATABASE_URL in .env uses localhost for host-side tooling; do not pass it here directly.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-k1}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-k1}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - VAULT_ADDR=${VAULT_ADDR:-http://vault:8200}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
    networks:
      - kai_internal
      - kai_admin # For admin panel to communicate with orchestrator
    depends_on:
      - postgres
      - redis
      - qdrant
    # Ensuring no elevated privileges for the orchestrator itself
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

  postgres:
    image: postgres:13-alpine
    container_name: kai_postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-k1}
      - POSTGRES_USER=${POSTGRES_USER:-k1}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - type: bind
        source: ${KAI_STORAGE_ROOT:-/srv/kai}/docker/postgres
        target: /var/lib/postgresql/data
    networks:
      - kai_internal
    read_only: true

  redis:
    image: redis:6-alpine
    container_name: kai_redis
    volumes:
      - type: bind
        source: ${KAI_STORAGE_ROOT:-/srv/kai}/docker/redis
        target: /data
    networks:
      - kai_internal
    read_only: true

  qdrant:
    image: qdrant/qdrant:latest
    container_name: kai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - type: bind
        source: ${KAI_STORAGE_ROOT:-/srv/kai}/docker/qdrant
        target: /qdrant/storage
    networks:
      - kai_internal

  # Admin GUI — nginx running as non-root kaiuser on port 8081
  admin_gui:
    build:
      context: .
      dockerfile: Dockerfile.admin
    image: kai-admin-gui
    container_name: kai_admin_gui
    ports:
      - "8080:8081"
    networks:
      - kai_admin
    depends_on:
      - orchestrator
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=1000,gid=1000
      - /var/run:uid=1000,gid=1000
      - /var/log/nginx:uid=1000,gid=1000
      - /tmp:uid=1000,gid=1000

  # Dedicated service for network-privileged tools
  network-tools-runner:
    # This service will be responsible for executing tools that require NET_RAW/NET_ADMIN
    # The orchestrator will trigger execution via a dedicated mechanism (e.g., internal API call or message queue)
    # For now, it directly defines and builds the Nmap tool.
    build:
      context: ./docker/nmap # Build context is specific to nmap Dockerfile
    image: kai-nmap
    container_name: kai_nmap
    networks:
      - kai_internal
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: ["--help"]
    read_only: true # Requires writable volume for output
    environment:
      <<: *kai_artifacts_env
      NMAP_OUTPUT_DIR: /tmp/nmap-output
    volumes: *kai_artifacts_volumes

  # Tool Containers (Representative Subset)
  theharvester:
    build: ./docker/theharvester
    image: kai-theharvester
    container_name: kai_theharvester
    networks:
      - kai_internal
    command: ["-h"]
    read_only: true # Requires writable volume for output
    # NOTE: kai-amass (another Go tool) build is currently blocked due to Go version incompatibility.

  nuclei:
    build: ./docker/nuclei
    image: kai-nuclei
    container_name: kai_nuclei
    networks:
      - kai_internal
    command: ["-h"] # Default command to show help
    read_only: true # Requires writable volume for output
    environment:
      <<: *kai_artifacts_env
      NUCLEI_OUTPUT_DIR: /tmp/nuclei-output
    volumes: *kai_artifacts_volumes
    # NOTE: kai-nuclei build is currently blocked due to Go version incompatibility.

  # Garak
  garak:
    build: ./docker/garak
    image: kai-garak
    container_name: kai_garak
    networks:
      - kai_internal
    command: ["--help"]
    read_only: true # Requires writable volume for output
  # PromptMap
  promptmap:
    build: ./docker/promptmap
    image: kai-promptmap
    container_name: kai_promptmap
    networks:
      - kai_internal
    command: ["--help"]
    read_only: true # Requires writable volume for output
  # LLM Guard
  llmguard:
    build: ./docker/llmguard
    image: kai-llmguard
    container_name: kai_llmguard
    networks:
      - kai_internal
    command: ["--help"]
    read_only: true # Requires writable volume for output
  # PyRIT
  pyrit:
    build: ./docker/pyrit
    image: kai-pyrit
    container_name: kai_pyrit
    networks:
      - kai_internal
    command: ["--help"]
    read_only: true # Requires writable volume for output


