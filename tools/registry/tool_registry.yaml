version: "2.0"
# Streamlined 35-Tool Registry for KaisonOne
# Optimized for 70-80% valid finding rate with Phase 6 ML/RL
# Date: 2026-05-01
# Removed: 117 redundant tools for surgical precision

tools:
  # === TIER 1: CORE RECONNAISSANCE (17 tools) ===
  # These tools run on EVERY scan
  
  # OSINT & Attack Surface (4 tools)
  - name: amass
    agent_class: AmassAgent
    category: osint_asset_discovery
    execution_mode: native
    binary_path: amass
    install_verification_cmd: ["amass", "-version"]
    input_schema: {"target": "domain"}
    output_schema: {"subdomains": "list[str]"}
    timeout_seconds: 900
    safety_classification: passive
    tier: 1
    
  - name: subfinder
    agent_class: SubfinderAgent
    category: osint_asset_discovery
    execution_mode: native
    binary_path: subfinder
    install_verification_cmd: ["subfinder", "-version"]
    input_schema: {"target": "domain"}
    output_schema: {"subdomains": "list[str]"}
    timeout_seconds: 600
    safety_classification: passive
    tier: 1
    api_keys_required: ["CHAOS_API_KEY", "GITHUB_TOKEN", "SHODAN_API_KEY"]
    
  - name: spiderfoot
    agent_class: SpiderFootAgent
    category: osint_intelligence
    execution_mode: native
    binary_path: spiderfoot
    install_verification_cmd: ["spiderfoot", "-h"]
    input_schema: {"target": "domain"}
    output_schema: {"intelligence": "dict"}
    timeout_seconds: 1800
    safety_classification: passive
    tier: 1
    
  - name: theharvester
    agent_class: TheHarvesterAgent
    category: osint_email_discovery
    execution_mode: native
    binary_path: theHarvester
    install_verification_cmd: ["theHarvester", "-h"]
    input_schema: {"target": "domain"}
    output_schema: {"emails": "list[str]", "hosts": "list[str]"}
    timeout_seconds: 600
    safety_classification: passive
    tier: 1
  
  # Network Enumeration (4 tools)
  - name: masscan
    agent_class: MasscanAgent
    category: network_port_scanning
    execution_mode: native
    binary_path: masscan
    install_verification_cmd: ["masscan", "--version"]
    input_schema: {"target": "cidr_or_ip", "ports": "list[int]"}
    output_schema: {"open_ports": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
    requires_root: true
    
  - name: nmap
    agent_class: NmapAgent
    category: network_enumeration
    execution_mode: native
    binary_path: nmap
    install_verification_cmd: ["nmap", "--version"]
    input_schema: {"target": "ip_or_host", "ports": "list[int]"}
    output_schema: {"services": "list[dict]", "os_info": "dict"}
    timeout_seconds: 900
    safety_classification: active
    tier: 1
    
  - name: naabu
    agent_class: NaabuAgent
    category: network_port_scanning
    execution_mode: native
    binary_path: naabu
    install_verification_cmd: ["naabu", "-version"]
    input_schema: {"target": "ip_or_fqdn"}
    output_schema: {"open_ports": "list[dict]"}
    timeout_seconds: 240
    safety_classification: active
    tier: 1
    
  - name: httpx
    agent_class: HttpxAgent
    category: http_service_enumeration
    execution_mode: native
    binary_path: httpx
    install_verification_cmd: ["httpx", "-version"]
    input_schema: {"target": "list[str]"}
    output_schema: {"live_hosts": "list[dict]"}
    timeout_seconds: 180
    safety_classification: active
    tier: 1
  
  # Web Discovery (3 tools)
  - name: gau
    agent_class: GauAgent
    category: web_discovery
    execution_mode: native
    binary_path: gau
    install_verification_cmd: ["gau", "--version"]
    input_schema: {"target": "domain"}
    output_schema: {"urls": "list[str]"}
    timeout_seconds: 900
    safety_classification: passive
    tier: 1
    
  - name: katana
    agent_class: KatanaAgent
    category: web_crawling
    execution_mode: native
    binary_path: katana
    install_verification_cmd: ["katana", "-version"]
    input_schema: {"target": "url"}
    output_schema: {"endpoints": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: active
    tier: 1
    
  - name: arjun
    agent_class: ArjunAgent
    category: parameter_discovery
    execution_mode: native
    binary_path: arjun
    install_verification_cmd: ["arjun", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"parameters": "list[str]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
  
  # Content Discovery (2 tools)
  - name: ffuf
    agent_class: FfufAgent
    category: content_discovery
    execution_mode: native
    binary_path: ffuf
    install_verification_cmd: ["ffuf", "-V"]
    input_schema: {"target": "url"}
    output_schema: {"discovered_paths": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
  
  # Vulnerability Scanning - Primary (5 tools)
  - name: nuclei
    agent_class: NucleiAgent
    category: vulnerability_scanning
    execution_mode: native
    binary_path: nuclei
    install_verification_cmd: ["nuclei", "-version"]
    input_schema: {"target": "url_or_host"}
    output_schema: {"findings": "list[json]"}
    timeout_seconds: 3600
    safety_classification: active
    tier: 1
    templates_required: true
    
  - name: dalfox
    agent_class: DalfoxAgent
    category: xss_scanning
    execution_mode: native
    binary_path: dalfox
    install_verification_cmd: ["dalfox", "version"]
    input_schema: {"target": "url"}
    output_schema: {"xss_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
    
  - name: sqlmap
    agent_class: SQLMapAgent
    category: sql_injection_scanning
    execution_mode: native
    binary_path: sqlmap
    install_verification_cmd: ["sqlmap", "--version"]
    input_schema: {"target": "url"}
    output_schema: {"sqli_findings": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: active
    tier: 1
    
  - name: ghauri
    agent_class: GhauriAgent
    category: sql_injection_scanning
    execution_mode: native
    binary_path: ghauri
    install_verification_cmd: ["ghauri", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"sqli_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
    redundancy_for: sqlmap
    
  - name: ssrfmap
    agent_class: SSRFMapAgent
    category: ssrf_scanning
    execution_mode: native
    binary_path: SSRFmap
    install_verification_cmd: ["ssrfmap.py", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"ssrf_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
  
  # XSS Secondary (1 tool)
  - name: xsstrike
    agent_class: XSStrikeAgent
    category: xss_scanning
    execution_mode: native
    binary_path: xsstrike
    install_verification_cmd: ["xsstrike", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"xss_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
    redundancy_for: dalfox

  # === TIER 2: TARGETED ASSESSMENT (14 tools) ===
  # Run conditionally based on asset type
  
  # API Testing (3 tools)
  - name: kiterunner
    agent_class: KiterunnerAgent
    category: api_security_scanning
    execution_mode: native
    binary_path: kr
    install_verification_cmd: ["kr", "version"]
    input_schema: {"target": "url"}
    output_schema: {"api_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 2
    triggers_on: ["api_endpoint_detected"]
    
  - name: graphqlmap
    agent_class: GraphQLMapAgent
    category: graphql_scanning
    execution_mode: native
    binary_path: graphqlmap
    install_verification_cmd: ["graphqlmap", "-h"]
    input_schema: {"target": "graphql_endpoint"}
    output_schema: {"graphql_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 2
    triggers_on: ["graphql_detected"]
    
  - name: restler
    agent_class: RESTlerAgent
    category: api_fuzzing
    execution_mode: native
    binary_path: RESTler
    install_verification_cmd: ["Restler", "--version"]
    input_schema: {"target": "api_spec"}
    output_schema: {"api_findings": "list[dict]"}
    timeout_seconds: 3600
    safety_classification: active
    tier: 2
    triggers_on: ["openapi_spec_detected"]
  
  # Cloud Security (3 tools)
  - name: proler
    agent_class: ProwlerAgent
    category: cloud_security_scanning
    execution_mode: native
    binary_path: proler
    install_verification_cmd: ["proler", "-v"]
    input_schema: {"target": "cloud_account"}
    output_schema: {"cloud_findings": "list[dict]"}
    timeout_seconds: 3600
    safety_classification: passive
    tier: 2
    triggers_on: ["cloud_assets_detected"]
    
  - name: scoutsuite
    agent_class: ScoutSuiteAgent
    category: cloud_security_auditing
    execution_mode: native
    binary_path: scoutsuite
    install_verification_cmd: ["scoutsuite", "--version"]
    input_schema: {"target": "cloud_provider"}
    output_schema: {"cloud_findings": "list[dict]"}
    timeout_seconds: 7200
    safety_classification: passive
    tier: 2
    triggers_on: ["multi_cloud_environment"]
    
  - name: trivy
    agent_class: TrivyAgent
    category: vulnerability_scanning
    execution_mode: native
    binary_path: trivy
    install_verification_cmd: ["trivy", "version"]
    input_schema: {"target": "image_or_filesystem"}
    output_schema: {"vulnerabilities": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: passive
    tier: 2
    triggers_on: ["container_or_code_detected"]
  
  # Authentication (3 tools)
  - name: jwt-tool
    agent_class: JWTToolAgent
    category: jwt_security_testing
    execution_mode: native
    binary_path: jwt_tool
    install_verification_cmd: ["jwt_tool", "-h"]
    input_schema: {"target": "jwt_token_or_endpoint"}
    output_schema: {"jwt_findings": "list[dict]"}
    timeout_seconds: 300
    safety_classification: active
    tier: 2
    triggers_on: ["jwt_detected"]
    
  - name: authmatrix
    agent_class: AuthMatrixAgent
    category: authorization_testing
    execution_mode: native
    binary_path: AuthMatrix
    install_verification_cmd: ["AuthMatrix.py", "-h"]
    input_schema: {"target": "web_application"}
    output_schema: {"idor_findings": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: active
    tier: 2
    triggers_on: ["role_based_access_detected"]
    
  - name: hydra
    agent_class: HydraAgent
    category: brute_force_testing
    execution_mode: native
    binary_path: hydra
    install_verification_cmd: ["hydra", "-h"]
    input_schema: {"target": "login_service"}
    output_schema: {"brute_findings": "list[dict]"}
    timeout_seconds: 3600
    safety_classification: active
    tier: 2
    triggers_on: ["brute_force_authorized_in_scope"]
  
  # Secrets Detection (2 tools)
  - name: trufflehog
    agent_class: TruffleHogAgent
    category: secrets_scanning
    execution_mode: native
    binary_path: trufflehog
    install_verification_cmd: ["trufflehog", "version"]
    input_schema: {"target": "repo_or_filesystem"}
    output_schema: {"secrets": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: passive
    tier: 2
    triggers_on: ["git_repository_detected"]
    
  - name: gitleaks
    agent_class: GitLeaksAgent
    category: secrets_scanning
    execution_mode: native
    binary_path: gitleaks
    install_verification_cmd: ["gitleaks", "version"]
    input_schema: {"target": "git_repo"}
    output_schema: {"secrets": "list[dict]"}
    timeout_seconds: 600
    safety_classification: passive
    tier: 2
    redundancy_for: trufflehog
    triggers_on: ["git_repository_detected"]
  
  # Business Logic (2 tools)
  - name: racetheweb
    agent_class: RaceTheWebAgent
    category: race_condition_testing
    execution_mode: native
    binary_path: racetheweb
    install_verification_cmd: ["racetheweb", "-h"]
    input_schema: {"target": "web_endpoint"}
    output_schema: {"race_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 2
    triggers_on: ["state_changing_endpoint_detected"]
    
  - name: fuxploider
    agent_class: FuxploiderAgent
    category: file_upload_testing
    execution_mode: native
    binary_path: fuxploider
    install_verification_cmd: ["fuxploider.py", "-h"]
    input_schema: {"target": "upload_endpoint"}
    output_schema: {"upload_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 2
    triggers_on: ["file_upload_endpoint_detected"]

  # === TIER 3: SPECIALIZED VALIDATION (4 tools) ===
  # Manual trigger or high-value targets
  
  - name: domdig
    agent_class: DOMDigAgent
    category: client_side_testing
    execution_mode: native
    binary_path: domdig
    install_verification_cmd: ["domdig", "-h"]
    input_schema: {"target": "web_application"}
    output_schema: {"dom_findings": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: active
    tier: 3
    
  - name: csp-evaluator
    agent_class: CSPEvaluatorAgent
    category: csp_analysis
    execution_mode: native
    binary_path: csp-evaluator
    install_verification_cmd: ["csp-evaluator", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"csp_findings": "list[dict]"}
    timeout_seconds: 300
    safety_classification: passive
    tier: 3
    
  - name: bloodhound
    agent_class: BloodHoundAgent
    category: active_directory_analysis
    execution_mode: native
    binary_path: bloodhound-python
    install_verification_cmd: ["bloodhound-python", "-h"]
    input_schema: {"target": "domain_controller"}
    output_schema: {"ad_findings": "list[dict]"}
    timeout_seconds: 3600
    safety_classification: active
    tier: 3
    requires_authorization: true
    
  - name: crackmapexec
    agent_class: CrackMapExecAgent
    category: network_lateral_movement
    execution_mode: native
    binary_path: crackmapexec
    install_verification_cmd: ["cme", "--version"]
    input_schema: {"target": "network_range"}
    output_schema: {"network_findings": "list[dict]"}
    timeout_seconds: 3600
    safety_classification: active
    tier: 3
    requires_authorization: true
    
  - name: mobsf
    agent_class: MobSFAgent
    category: mobile_security_testing
    execution_mode: native
    binary_path: mobsf
    install_verification_cmd: ["mobsf", "-h"]
    input_schema: {"target": "mobile_app_binary"}
    output_schema: {"mobile_findings": "list[dict]"}
    timeout_seconds: 3600
    safety_classification: passive
    tier: 3
    triggers_on: ["mobile_application_detected"]
