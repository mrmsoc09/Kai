  cves:
  - CVE-2018-11052
  - CVE-2021-44228
  - CVE-2019-3822
  - CVE-2020-10693
  - CVE-2018-18389
  distributed_across_types:
  - RCE
  - Auth-Bypass
  - LPE
  - Data-Breach
  - Web-API
attack_sequence:
  step_1:
    title: Initialize
    executor_persona: privilege_escalation_specialist
    input: From input_source
    output: Ready for step_2
  step_2:
    title: Execute
    executor_persona: privilege_escalation_specialist
    input: From step_1
    output: To step_3
