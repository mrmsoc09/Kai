version: "1.0"

# Consolidated tool registry for KAISON AI (51 tools total)
# Cleaned of duplicates 2026-04-04
# All entries standardized to common schema

tools:
  # Wave 0 - Core Recon (7 tools)
  - name: amass
    agent_class: AmassAgent
    category: recon_asset_discovery
    execution_mode: native
    binary_path: amass
    install_verification_cmd: ["amass", "-version"]
    input_schema: {"target": "domain"}
    output_schema: {"subdomains": "list[str]"}
    timeout_seconds: 900
    safety_classification: passive

  - name: subfinder
    agent_class: SubfinderAgent
    category: recon_asset_discovery
    execution_mode: native
    binary_path: subfinder
    install_verification_cmd: ["subfinder", "-version"]
