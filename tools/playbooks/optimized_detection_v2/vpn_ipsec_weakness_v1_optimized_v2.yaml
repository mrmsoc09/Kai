playbook:
  metadata:
    name: 'Detection Profile: VPN & IPSec Protocol Weakness Detection (Optimized Detection
      v2)'
    id: det_vpn_ipsec_weakness_v1_optimized_v2
    version: '2.0'
    base_detection_playbook_id: det_vpn_ipsec_weakness_v1
    operation_type: detection_only
    scope_lock_required: true
    non_destructive_only: true
  guardrails:
    forbidden_operations:
    - exploitation
    - persistence
    - destruction
    - evasion
    - lateral_movement
    required_preconditions:
    - authorized_scope_verified
    - opportunity_active
    - safe_mode_enabled
    reporting_mode: proof_of_concept_evidence_only
  optimization_baseline:
    baseline_execution_minutes: 14
    optimized_execution_minutes: 5
    baseline_network_requests: 308
    optimized_network_requests: 148
    time_reduction_percent: 64.29
    noise_reduction_percent: 51.95
  target_aware_scanning_strategy:
    early_stage_saas:
      detection_patterns:
      - weak_tls_config_scan
      - jwt_alg_weakness_detection
      - key_rotation_policy_check
      scan_depth: thorough
      timeout_seconds: 17
      max_requests: 128
      expected_detection_probability: 0.0711
    enterprise_multi_property:
      detection_patterns:
      - legacy_protocol_enablement_scan
      - certificate_chain_validation_check
      - cipher_suite_hardening_scan
      scan_depth: moderate
      timeout_seconds: 26
      max_requests: 112
      expected_detection_probability: 0.0643
    fintech_regulated:
      detection_patterns:
      - strict_cipher_policy_validation
      - mTLS_posture_check
      - crypto_regression_scan
      scan_depth: deep
      timeout_seconds: 38
      max_requests: 96
      expected_detection_probability: 0.0609
  execution_logic:
    selection_rule: Classify target archetype, then execute only listed high-frequency
      detection patterns.
    batching: Group compatible endpoint checks by route to reduce duplicate requests.
    early_stop: Stop when confidence threshold reached for vulnerability reportability.
    fallback: If archetype unknown, use early_stage_saas patterns with enterprise
      timeout.
  optimization_rationale: Focuses scanning effort on high-frequency-detection vectors
    and removes low-probability pattern sweeps to reduce time and network noise while
    preserving finding quality.
