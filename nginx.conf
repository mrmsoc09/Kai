# Rate limiting zones (defined outside server block)
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=static:10m rate=100r/s;

server {
    # 8081 — unprivileged port so nginx can run as non-root
    listen 8081;
    server_name localhost;
    server_tokens off;

    # Security headers for all responses from this server
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    # HSTS is only meaningful when TLS is terminated here; set at load-balancer layer if TLS
    # terminates upstream. Uncomment if this nginx instance handles HTTPS directly:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_req zone=static burst=200 nodelay;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to the backend service
    location /admin/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
