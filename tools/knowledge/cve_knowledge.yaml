      tools_for_exploitation: ["padding_oracle_tool", "featherduster"]

    impact:
      confidentiality: "High"
      integrity: "Medium"
      availability: "None"
      real_world_impact: "Attacker can decrypt TLS session data including credentials"
      in_the_wild:
        status: "Yes - actively exploited"
        incidents: 12
        last_incident: "2016-07-20"

    remediation:
      patches:
        - version: "1.0.2h"
          released: "2016-05-03"
      mitigation_steps:
        - "Upgrade to OpenSSL 1.0.2h or later"
