playbook:
  metadata:
    name: Cryptographic Protocol Downgrade & Key Recovery (High-Frequency Optimized
      v2)
    id: cryptographic_downgrade_v1_optimized_v2
    version: '2.0'
    base_playbook_id: cryptographic_downgrade_v1
    category: Cryptography
    optimization_focus: High-frequency vulnerability patterns by target archetype
    scope_lock_required: true
  optimization_baseline:
    baseline_execution_minutes: 30
    optimized_execution_minutes: 10
    baseline_success_rate: 0.62
    optimized_success_rate: 0.79
    expected_time_reduction_percent: 66.7
    expected_success_uplift_percent: 27.4
  pre_execution_target_classification:
    required_playbooks:
    - target_fingerprinter_v1
    - archetype_classifier_v1
    - vulnerability_predictor_v1
    required_outputs:
    - target_archetype
    - confidence_score
    - recommended_top_playbooks
    scope_validation_first: true
  target_aware_routing:
    startup:
      exploitation_patterns:
      - weak_tls_cipher_downgrade
      - token_signature_validation_gap
      - insecure_jwt_crypto_mode
      timeout_seconds: 180
      expected_success_rate: 0.91
      execution_mode: high_frequency_only
    enterprise:
      exploitation_patterns:
      - legacy_protocol_enablement
      - certificate_chain_misvalidation
      - key_rotation_gap_check
      timeout_seconds: 300
      expected_success_rate: 0.83
      execution_mode: high_frequency_only
    government:
      exploitation_patterns:
      - crypto_policy_compliance_gap
      - strict_cipher_downgrade_verification
      timeout_seconds: 480
      expected_success_rate: 0.67
      execution_mode: high_frequency_only
  execution_logic:
    selection_rule: Use target archetype route; execute only listed high-frequency
      patterns.
    early_exit: Stop on first validated critical/high finding or after pattern list
      exhausted.
    fallback: If archetype unknown, run startup route with enterprise timeout.
  optimization_rationale: Original playbook 'cryptographic_downgrade_v1' executed
    broad pattern sets. v2 reduces low-probability pattern execution and targets high-frequency
    crypto paths for startup/enterprise/government archetypes using Prompt 5 frequency
    intelligence.
