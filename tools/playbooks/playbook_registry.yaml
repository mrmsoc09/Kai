    - 3
    - 7
    - 9
    personas:
    - evasion_specialist
    - proxy_operator
    tools:
    - proxy_tools
    - vpn_tools
  decision_trees:
  - condition: Web application reconnaissance complete
    recommendations:
    - If GraphQL API found -> graphql_attacks_v1
    - If auth-control weakness found -> auth_bypass_v1 or owasp_a01_access_control_v1
    - If SQLi signals found -> sql_injection_v1 or owasp_a03_injection_v1
    - If crypto weakness found -> owasp_a02_crypto_v1
    - If misconfiguration found -> owasp_a05_misconfig_v1
  - condition: SQLi signal confirmed
    recommendations:
    - sql_injection_v1
    - owasp_a03_injection_v1 (comprehensive injection testing)
    - xss_discovery_v1 (if shared input sinks)
  - condition: API endpoint with token auth discovered
    recommendations:
    - auth_bypass_v1
    - owasp_a01_access_control_v1 (authorization testing)
    - graphql_attacks_v1
  - condition: Access control weakness found
    recommendations:
    - owasp_a01_access_control_v1 (comprehensive IDOR/privilege escalation)
    - auth_bypass_v1
  - condition: TLS/Crypto weakness found
    recommendations:
    - owasp_a02_crypto_v1
  - condition: Business logic or workflow weakness found
    recommendations:
    - owasp_a04_design_v1
  - condition: Default credentials or misconfig found
    recommendations:
    - owasp_a05_misconfig_v1
  - condition: LLM application discovered
    recommendations:
    - ai_llm_prompt_injection_v1 (initial LLM security assessment)
    - ai_llm_model_extraction_v1 (if API access available)
    - ai_llm_vector_db_v1 (if RAG system detected)
    - ai_llm_supply_chain_v1 (assess model dependencies)
  - condition: Prompt injection successful
    recommendations:
    - ai_llm_model_extraction_v1 (attempt system prompt extraction)
    - ai_llm_vector_db_v1 (test RAG for injection)
  - condition: Containerized LLM inference detected
    recommendations:
    - ai_llm_container_escape_v1
  - condition: Model or dependency supply chain concern
    recommendations:
    - ai_llm_supply_chain_v1
  orchestration_sequences:
  - phase: 1
    playbooks:
    - web_app_recon_v1
    - ai_llm_supply_chain_v1
    purpose: Asset discovery and supply chain assessment
  - phase: 2-3
    playbooks:
    - owasp_a02_crypto_v1
    - owasp_a05_misconfig_v1
    purpose: Configuration and crypto assessment
  - phase: 7
    playbooks:
    - owasp_a01_access_control_v1
    - owasp_a03_injection_v1
    - owasp_a04_design_v1
    - sql_injection_v1
    - xss_discovery_v1
    - auth_bypass_v1
    - graphql_attacks_v1
    - ai_llm_prompt_injection_v1
    - ai_llm_model_extraction_v1
    - ai_llm_vector_db_v1
    - ai_llm_container_escape_v1
    purpose: Active exploitation and vulnerability validation
  - phase: 8-9
    playbooks:
    - all
    purpose: Impact assessment and reporting
