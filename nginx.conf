server {
    # 8081 — unprivileged port so nginx can run as non-root kaiuser
    listen 8081;
    server_name localhost;

    # Store pid in /tmp so non-root user can write it
    # (set in main nginx.conf via docker override or via /etc/nginx/nginx.conf)

    # Placeholder for Nginx Basic Authentication
    # To enable, uncomment these lines and create a .htpasswd file:
    # auth_basic "Restricted Access";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the orchestrator service
    location /admin/ {
        proxy_pass http://orchestrator:8080/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
