    execution_mode: native
    binary_path: dalfox
    install_verification_cmd: ["dalfox", "version"]
    input_schema: {"target": "url"}
    output_schema: {"xss_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1

  - name: sqlmap
    agent_class: SQLMapAgent
    category: sql_injection_scanning
    execution_mode: native
    binary_path: sqlmap
    install_verification_cmd: ["sqlmap", "--version"]
    input_schema: {"target": "url"}
    output_schema: {"sqli_findings": "list[dict]"}
    timeout_seconds: 1800
    safety_classification: active
    tier: 1

  - name: ghauri
    agent_class: GhauriAgent
    category: sql_injection_scanning
    execution_mode: native
    binary_path: ghauri
    install_verification_cmd: ["ghauri", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"sqli_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
    redundancy_for: sqlmap

  - name: ssrfmap
    agent_class: SSRFMapAgent
    category: ssrf_scanning
    execution_mode: native
    binary_path: SSRFmap
    install_verification_cmd: ["ssrfmap.py", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"ssrf_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1

  # XSS Secondary
  - name: xsstrike
    agent_class: XSStrikeAgent
    category: xss_scanning
    execution_mode: native
    binary_path: xsstrike
    install_verification_cmd: ["xsstrike", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"xss_findings": "list[dict]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1
