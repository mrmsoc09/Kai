    install_verification_cmd: ["hakrawler", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"endpoints": "list[str]"}
    timeout_seconds: 600
    safety_classification: active
    tier: 1

  - name: whatweb
    agent_class: WhatwebAgent
    category: technology_fingerprinting
    execution_mode: native
    binary_path: whatweb
    install_verification_cmd: ["whatweb", "--version"]
    input_schema: {"target": "url"}
