        - rank: 4
          cve_id: "CVE-2024-3400"
          name: "PAN-OS"
          frequency_in_archetype: 0.78
          rationale: "Palo Alto firewalls dominant at enterprise perimeter"
        - rank: 5
          cve_id: "CVE-2022-40684"
          name: "Fortinet FortiGate"
          frequency_in_archetype: 0.72
          rationale: "FortiGate common secondary perimeter device"

      success_metrics:
        expected_success_rate: 0.58
        median_compromise_time_minutes: 240
        median_dwell_time_before_detection_days: 10
        source: "Mandiant M-Trends 2024: median enterprise dwell time = 10 days"
        notes: "Requires chaining (initial access → bypass EDR → lateral movement); single-exploit less likely"

    ################################################################################
    # ARCHETYPE 4: MSSP/HOSTING PROVIDER
    ################################################################################

    - id: "archetype_mssp"
      name: "MSSP / Web Hosting Provider"
      description: "Manages infrastructure for multiple clients; compromise yields access to entire client portfolio"
      characteristics:
        employee_count: "20-500"
        it_maturity: "Medium-High"
        security_investment_annual: "$200K-$5M"
        special_risk: "Compromise = access to ALL managed clients (supply chain multiplier)"
        security_controls:
          siem: "yes (managing many)"
          edr: "yes (deployed to clients)"
          waf: "yes (protecting clients)"
          mfa: "usually for admin"

      technology_stack:
        infrastructure:
          - "VMware vCenter/ESXi (60% of MSSPs)"
          - "cPanel / Plesk (hosting providers)"
          - "Ansible/Puppet/Chef (automation)"
          - "Kubernetes (container orchestration)"
        monitoring_tools:
          - "Nagios, Zabbix, PRTG"
          - "Elastic Stack"
          - "Grafana"
        client_management:
          - "Kaseya VSA (RMM)"
          - "ConnectWise Automate"
          - "N-able"

      vulnerability_distribution:
        rmm_tool_vulnerabilities:
          frequency: 0.72
          confidence: "HIGH"
          source: "Kaseya/SolarWinds/ConnectWise CVEs; REvil attacked Kaseya affecting 1,500 companies"

        hypervisor_vulnerabilities:
          frequency: 0.65
          confidence: "HIGH"
          source: "VMware CVEs; ESXiArgs ransomware (Feb 2023) hit 3,800+ VMware hosts"

        certificate_management_weakness:
          frequency: 0.60
          confidence: "HIGH"

        network_device_exposure:
          frequency: 0.80
          confidence: "HIGH"
          source: "Shodan: MSSP network devices highest exposure density"

        shared_infrastructure_risks:
          frequency: 0.75
          confidence: "HIGH"

        file_transfer_vulnerabilities:
          frequency: 0.80
          confidence: "HIGH"
          source: "MOVEit CVE-2023-34362 targeted MSSPs specifically"

      most_exploitable_cves_ranked:
        - rank: 1
          cve_id: "CVE-2023-34362"
          name: "MOVEit Transfer"
          frequency_in_archetype: 0.80
          rationale: "MSSPs are primary managed file transfer operators"
        - rank: 2
          cve_id: "CVE-2023-44487"
          name: "HTTP2 RapidReset"
          frequency_in_archetype: 0.94
          rationale: "MSSP web servers handle massive traffic volume"

      success_metrics:
        expected_success_rate: 0.68
        median_compromise_time_minutes: 90
        supply_chain_multiplier: "1 compromise → median 24 downstream clients accessed"
        source: "Kaseya/SolarWinds post-incident analysis; CISA supply chain advisories"

