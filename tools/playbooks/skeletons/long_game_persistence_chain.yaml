metadata:
  name: Long Game Persistence Chain
  id: long_game_persistence_chain
  version: '1.0'
  cluster: PERSISTENCE
  complexity: HIGH
  created: '2026-04-12T02:45:29.857893'
objective:
  primary: 'Execute persistence phase: long_game_persistence_chain'
  secondary:
  - Minimize detection
  - Enable adaptive pivoting
  - Prepare next phase
inputs_and_sources:
  input_source: establish_persistence_chain, lateral_movement_chain
  required_input:
  - target_profile
  - recon_data
outputs_and_targets:
  primary_output_target: log_removal_chain
  fallback_target: credential_theft_chain
  alternate_targets: []
cve_bindings:
  count: 5
  cves:
  - CVE-2024-20123
  - CVE-2024-22456
  - CVE-2024-20890
  - CVE-2024-20234
  - CVE-2024-21445
  distributed_across_types:
  - RCE
  - Auth-Bypass
  - LPE
  - Data-Breach
  - Web-API
attack_sequence:
  step_1:
    title: Initialize
    executor_persona: proof_of_concept_generator
    input: From input_source
    output: Ready for step_2
  step_2:
    title: Execute
    executor_persona: lateral_movement_planner
    input: From step_1
    output: To step_3
  step_3:
    title: Validate
    executor_persona: proof_of_concept_generator
    input: From step_2
    output: Success or fallback
decision_branches:
- condition: If execution succeeds
  action: Call log_removal_chain
- condition: If execution fails
  action: Call credential_theft_chain
- condition: If detected
  action: Call incident_responder_evasion or detection_evasion
cross_link_graph:
  calls_these_playbooks:
  - log_removal_chain
  called_by_these_playbooks:
  - social_engineering_chain
  - data_exfiltration_chain
  - domain_compromise_chain
  - supply_chain_persistence
  - iot_expansion_chain
  - ransomware_deployment
  - insider_threat_activation
  can_pivot_to:
  - log_removal_chain
  - credential_theft_chain
  is_entry_point: false
  is_terminal: false
personas_assigned:
- proof_of_concept_generator
- lateral_movement_planner
