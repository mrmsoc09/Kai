    binary_path: webanalyze
    install_verification_cmd: ["webanalyze", "-version"]
    input_schema: {"target": "url"}
    output_schema: {"technologies": "list[dict]"}
    timeout_seconds: 300
    safety_classification: passive
    tier: 1

  - name: corsy
    agent_class: CorsyAgent
    category: cors_scanning
    execution_mode: native
    binary_path: corsy.py
    install_verification_cmd: ["python3", "/opt/tools/Corsy/corsy.py", "-h"]
    input_schema: {"target": "url"}
    output_schema: {"cors_findings": "list[dict]"}
