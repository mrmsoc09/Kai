# Tool Bidding Rules for KAISON AI (ISSUE #7)
#
# Each tool entry configures how YamlConfiguredToolAgent computes its bid.
#
# Fields:
#   phase_affinity          List of K1GraphState phase strings where this tool
#                           is most useful. Empty list = always eligible.
#                           Mismatch incurs a 0.4 confidence penalty.
#
#   dependencies            List of FindingDataset field names that must be
#                           non-empty. Tool abstains (confidence=0) if unmet.
#
#   estimated_cost_cents    Estimated monetary cost of one run (0 = free tool).
#
#   execution_time_estimate_ms  Rough wall-clock time for planning purposes.
#
#   output_schema           Map of output field name → type description.
#
#   priority_boost_if_goals List of goal strings that trigger a priority boost.
#   priority_boost_value    Boost multiplier (default: 1.5).
#
# Phase names (from K1GraphState.phase):
#   recon, enumeration, fingerprinting, discovery, osint,
#   dark_web, secrets, vuln_scanning, api_testing, aggregation
#
# Bid score formula:  confidence × (100 / (1 + cost_cents)) × priority_boost

# ---------------------------------------------------------------------------
# Passive recon / subdomain discovery
# ---------------------------------------------------------------------------

subfinder:
  phase_affinity: [recon, enumeration]
  dependencies: []
  estimated_cost_cents: 0
  execution_time_estimate_ms: 30000
  output_schema:
    subdomains: "list[str]"
  priority_boost_if_goals: [subdomain_enumeration, asset_discovery]
  priority_boost_value: 1.5

