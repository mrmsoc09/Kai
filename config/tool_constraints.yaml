# Tool argument constraints for KAISON AI subprocess validators
#
# This file is a human-readable audit reference that mirrors the constraints
# enforced in apps/backend/src/core/tool_adapters/validators.py.
# It is NOT loaded at runtime. The Python code is the authoritative source.
#
# To add a new tool:
#   1. Implement a ToolValidator subclass in validators.py decorated with @register("toolname")
#   2. Add the corresponding entry below for auditing
#
# Threat categories referenced below:
#   INJECT  - Shell/argument injection via unvalidated string parameters
#   DOS     - Denial-of-service via unbounded numeric parameters
#   TRAV    - Directory/path traversal to access files outside intended base
#   SSRF    - Server-side request forgery via non-HTTP URL schemes
#   PROTO   - Protocol-level injection (null bytes, control characters in headers)

nuclei:
  description: "Fast and customizable vulnerability scanner (ProjectDiscovery)"
  validator_class: NucleiValidator
  parameters:
    tags:
      type: str
      pattern: "^[a-zA-Z0-9,_-]+$"
      description: "Comma-separated template tags"
      threat: INJECT
      notes: "Rejects semicolons, pipes, backticks, dollar signs, spaces, etc."

    rate_limit:
      type: int
      min: 1
      max: 1000
      units: requests_per_second
      default: 150
      threat: DOS
      notes: "Nuclei default is 150 rps; cap prevents flooding targets or local network"

    timeout:
      type: int
      min: 1
      max: 300
      units: seconds
      default: 5
      threat: DOS
      notes: "Per-request timeout; nuclei default is 5 s"

    retries:
      type: int
      min: 0
      max: 10
      default: 1
      threat: DOS

    severity:
      type: str
      enum: [critical, high, medium, low, info]
      description: "Comma-separated severity filter (e.g. 'critical,high')"
      threat: INJECT
      notes: "Each comma-separated value must be in the enum"

    templates:
      type: path
      base_env: NUCLEI_TEMPLATES_BASE
      default_base: "~/nuclei-templates"
      path_validation: true
      symlink_resolution: true
      threat: TRAV
      notes: >
        Resolved with os.path.realpath() before comparison.
        Absolute paths and ../ sequences that escape the base directory are rejected.
        Symlinks pointing outside base_dir are also rejected.

nmap:
  description: "Network exploration and security auditing tool"
  validator_class: NmapValidator
  parameters:
    ports:
      type: str
      format: "comma-separated ports and ranges (e.g. '80,443,8080-9090')"
      port_range: [1, 65535]
      max_segments: 100
      threat: [INJECT, DOS]
      notes: >
        Only digits, commas, and dashes allowed.
        Each port number must be 1–65535.
        Range start must be ≤ range end.
        Max 100 comma-separated segments prevents memory-exhaustion argument lists.

    timing:
      type: int
      min: 0
      max: 5
      description: "nmap timing template (T0=paranoid … T5=insane)"
      default: 3
      threat: DOS

    script:
      type: str
      pattern: "^[a-zA-Z0-9_,-]+$"
      description: "NSE script name or comma-separated list"
      threat: INJECT
      notes: >
        Path separators (/ and \\) are rejected to prevent loading NSE scripts
        from arbitrary filesystem paths via --script ../../evil.nse.

sqlmap:
  description: "Automatic SQL injection detection and exploitation tool"
  validator_class: SqlmapValidator
  parameters:
    url:
      type: url
      schemes: [http, https]
      threat: SSRF
      notes: "file://, ftp://, gopher://, and other schemes are rejected"

    target:
      type: url
      schemes: [http, https]
      threat: SSRF
      notes: "Alias for 'url'; same constraint applies"

    level:
      type: int
      min: 1
      max: 5
      default: 3
      threat: DOS
      notes: "Higher levels cause more HTTP requests; capped at documented maximum"

    risk:
      type: int
      min: 1
      max: 3
      default: 1
      threat: DOS
      notes: >
        risk=2 adds heavy time-based tests; risk=3 adds OR-based tests that
        can modify database data. Only values 1–3 are documented by sqlmap.

    threads:
      type: int
      min: 1
      max: 10
      default: 10
      threat: DOS
      notes: "Capped to prevent exhausting local network stack or target connection limits"

    technique:
      type: str
      allowed_chars: [B, E, U, S, T, Q]
      description: >
        SQL injection techniques:
        B=Boolean-based blind, E=Error-based, U=UNION query,
        S=Stacked queries, T=Time-based blind, Q=Inline queries
      threat: INJECT
      notes: "Unknown characters rejected; value uppercased before use"

    cookie:
      type: str
      max_length: 4096
      encoding: printable_ascii
      threat: PROTO
      notes: >
        Null bytes (\\x00) rejected — can truncate strings in C-based HTTP parsers.
        Non-printable ASCII (0x00–0x1F, 0x7F+) rejected — can corrupt HTTP headers
        or exploit parser bugs in intermediate proxies.

masscan:
  description: "High-speed TCP port scanner"
  validator_class: MasscanValidator
  parameters:
    ports:
      type: str
      format: "comma-separated ports and ranges (e.g. '80,443,1-1000')"
      port_range: [1, 65535]
      max_segments: 100
      threat: [INJECT, DOS]
      notes: "Same port validation logic as nmap"

    rate:
      type: int
      min: 1
      max: 10000
      units: packets_per_second
      default: 10000
      threat: DOS
      notes: >
        10000 pps is a conservative cap. masscan can do millions of pps but
        values above ~10k risk saturating network links and crashing targets.
        Authorised testing engagements should negotiate the appropriate rate.

    excludes:
      type: list[cidr]
      threat: INJECT
      notes: >
        Each element must be a valid IPv4 or IPv6 CIDR block validated by
        Python's ipaddress.ip_network(). Arbitrary strings could be misinterpreted
        by masscan's network stack exclusion logic.
